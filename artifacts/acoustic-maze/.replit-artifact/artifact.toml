kind = "web"
previewPath = "/"
title = "Unseen Maze"
description = "A touch-only Android-responsive 3D echolocation puzzle game with exactly 99 progressive levels. Swipe to navigate, tap to reveal the pitch-black maze, and explore caves, vaults, crystals, catacombs, cyber-corridors and shifting void paths."
version = "1.0.0"
id = "artifacts/acoustic-maze"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24333

[services.development]
run = "pnpm --filter @workspace/acoustic-maze run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/acoustic-maze", "run", "build" ]
serve = "static"
publicDir = "artifacts/acoustic-maze/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24333"
BASE_PATH = "/"
